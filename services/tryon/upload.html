<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuyFit — Essayer un vêtement</title>
<link rel="stylesheet" href="/tryon/assets/upload.css">
<script src="/tryon/assets/upload.js" defer></script>
<main>
  <header><a href="/tryon/upload">BuyFit</a><a href="/docs">Documentation API</a></header>
  <h1>Essayer un vêtement</h1>
  <p id="mode" role="status">Vérification du moteur…</p>
  <form id="tryon-form">
    <div class="inputs">
      <section>
        <label for="person">Photo de la personne</label>
        <p>De face, avec le buste visible.</p>
        <input id="person" name="person" type="file" accept="image/png,image/jpeg,image/webp" required>
        <img id="person-preview" class="preview" alt="Aperçu de la personne" hidden>
      </section>
      <section>
        <label for="garment">Vêtement</label>
        <p>Un haut présenté de face.</p>
        <input id="garment" name="garment" type="file" accept="image/png,image/jpeg,image/webp" required>
        <img id="garment-preview" class="preview" alt="Aperçu du vêtement" hidden>
      </section>
    </div>
    <p>JPEG, PNG ou WebP · 8 Mo maximum par image.</p>
    <button id="generate" type="submit" disabled>Essayer</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="error" role="alert" hidden></p>
  <section id="result" hidden aria-labelledby="result-title">
    <h2 id="result-title">Résultat</h2>
    <p id="result-info"></p>
    <img id="result-image" alt="Résultat de l’essayage">
    <div class="result-actions">
      <a id="download" class="download" download>Télécharger l’image</a>
      <a id="open-image" target="_blank" rel="noopener">Ouvrir l’image</a>
    </div>
    <p>Export conservé sur ce serveur pendant 24 h, dans la limite de 20 images.</p>
  </section>
</main>
</html>
